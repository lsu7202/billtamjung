[project]
name = "billtamjung-backend"
version = "0.1.0"
description = "빌탐정 백엔드 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "google-genai>=2.0",
    "httpx>=0.27",
    # Dockerfile 에만 적혀 있던 둘(2026-09-21). 목록이 둘이라 google-genai 가 이미지에서
    # 빠졌다 — 이제 Dockerfile 이 이 목록을 읽는다. 여기가 정본이다.
    "email-validator>=2.1",
    "google-cloud-storage>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
